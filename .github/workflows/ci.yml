name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run deploy
      - name: root index.html and v2/dist must match v2/src
        run: git -C .. diff --exit-code --stat -- index.html v2/dist/index.html

  # Real engines over W3C WebDriver. Ubuntu runner images ship Firefox + geckodriver and
  # Chrome + chromedriver; the macOS image ships Safari + safaridriver.
  browsers-linux:
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: audio sink for Firefox (the runner has no sound device; Chromium fakes one, Firefox does not)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pulseaudio >/dev/null
          pulseaudio --start --exit-idle-time=-1
          pactl info | head -4
      - run: node browser-tests/smoke.mjs --browser=firefox,chromium --strict

  browsers-safari:
    runs-on: macos-latest
    needs: check
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: sudo safaridriver --enable
      - run: node browser-tests/smoke.mjs --browser=safari --strict
