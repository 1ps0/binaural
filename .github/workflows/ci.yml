name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run deploy
      - name: root index.html and v2/dist must match v2/src
        run: git -C .. diff --exit-code --stat -- index.html v2/dist/index.html
